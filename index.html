<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brightspace Remaining Work Dashboard</title>
<style>:root{--ink:#172033;--muted:#667085;--line:#e5e7eb;--blue:#315efb;--bg:#f7f8fc;--card:#fff;--red:#c0392b;--gold:#a16207}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:1120px;margin:auto;padding:38px 22px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:26px}h1{margin:0;font-size:clamp(28px,4vw,42px);letter-spacing:-.04em}.sub{color:var(--muted);margin:7px 0 0}.badge{background:#e8edff;color:#2444bd;padding:7px 12px;border-radius:999px;font-weight:700;white-space:nowrap}.controls,.stats,.grid{display:grid;gap:14px}.controls{grid-template-columns:1.4fr 1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}select{width:100%;padding:10px;border:1px solid #d6d9e0;border-radius:9px;background:white;color:var(--ink);font-size:14px}.stats{grid-template-columns:repeat(3,1fr);margin-bottom:22px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.stat{padding:17px}.num{font-size:27px;font-weight:800}.small{color:var(--muted);font-size:13px}.grid{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.card{padding:20px;position:relative}.card.priority{border-top:4px solid var(--blue)}.card.carry{border-top:4px solid var(--red)}.course{color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h2{margin:4px 0;font-size:19px}.date{font-weight:750;margin:15px 0 10px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#edf0f5;color:#566176}.high{background:#fee9e7;color:var(--red)}.inferred{background:#fff4d8;color:var(--gold)}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed #cfd4df;border-radius:16px}.footer{margin-top:28px;color:var(--muted);font-size:12px}</style></head>
<body><main class="wrap"><header><div><h1>Remaining Work</h1><p class="sub">Brightspace dashboard · updated October 26, 2026</p></div><div class="badge">Active work only</div></header>
<section class="controls"><div><label for="view">View</label><select id="view"><option value="priority">Priority View</option><option value="all">All Remaining Work</option></select></div><div><label for="sort">Sort</label><select id="sort"><option value="priority">Priority order</option><option value="asc">Deadline ascending</option><option value="desc">Deadline descending</option></select></div><div><label for="status">Status</label><select id="status"><option value="active">Not completed</option><option value="all">All tracked items</option></select></div></section>
<section class="stats"><div class="stat"><div class="num" id="count">4</div><div class="small">items shown</div></div><div class="stat"><div class="num">3</div><div class="small">main priority areas</div></div><div class="stat"><div class="num">1</div><div class="small">carryover submission</div></div></section><section id="cards" class="grid"></section><p class="footer">Completed courses and submitted/graded items are hidden. Inferred or conflicting dates are labeled clearly; Brightspace itself is not modified.</p></main>
<script>const items=[{course:'BADM-700',title:'Craft Academic Writing for Business',detail:'Primary course work and remaining workshops',date:'2026-12-20',dateLabel:'Dec 20, 2026',kind:'priority',tag:'Priority 1',status:'Not completed'},{course:'ADP Experience',title:'ADP Experience — Lind',detail:'Doctoral submissions and related requirements',date:null,dateLabel:'No single deadline found',kind:'priority',tag:'Priority 2',status:'Not completed'},{course:'UNV-701',title:'Doctoral Practical Training / Externship',detail:'Primary course work and remaining requirements',date:'2026-12-31',dateLabel:'Dec 31, 2026',kind:'priority',tag:'Priority 3',status:'Not completed'},{course:'BADM-701',title:'4.4 Why do you want to obtain a DBA degree?',detail:'Submit separately to ADP Experience Shell → Assess & Reflect Repository',date:'2026-11-08',dateLabel:'Nov 8, 2026 (inferred)',kind:'carry',tag:'Carryover · date conflict',status:'Not submitted',inferred:true}];const cards=document.querySelector('#cards');function render(){let view=document.querySelector('#view').value,sort=document.querySelector('#sort').value;let a=items.filter(x=>view==='all'||x.kind==='priority'||x.kind==='carry');if(sort==='asc')a.sort((x,y)=>(x.date||'9999').localeCompare(y.date||'9999'));if(sort==='desc')a.sort((x,y)=>(y.date||'0000').localeCompare(x.date||'0000'));if(sort==='priority')a.sort((x,y)=>items.indexOf(x)-items.indexOf(y));cards.innerHTML=a.length?a.map(x=>'<article class="card '+x.kind+'"><div class="course">'+x.course+'</div><h2>'+x.title+'</h2><div class="small">'+x.detail+'</div><div class="date">'+x.dateLabel+'</div><span class="pill '+(x.kind==='carry'?'high':'')+'">'+x.tag+'</span> <span class="pill '+(x.inferred?'inferred':'')+'">'+x.status+'</span></article>').join(''):'<div class="empty">No remaining work matches this view.</div>';document.querySelector('#count').textContent=a.length}document.querySelectorAll('select').forEach(x=>x.addEventListener('change',render));render();</script></body></html>
